<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; }
      .blk { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.2; }
      .shared { fill: #fde68a; stroke: #d97706; stroke-width: 1.4; }
      .part { fill: #e0f2fe; stroke: #3b82f6; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .cache { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.4; }
      .free { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1; }
      .t { fill: #0f172a; }
      .s { fill: #475569; font-size: 11.5px; }
      .h { font-weight: 600; font-size: 14px; fill: #0f172a; }
      .ln { stroke: #475569; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="570" fill="#ffffff"/>

  <!-- scheduler layer -->
  <rect class="box" x="20" y="14" width="860" height="78" rx="8"/>
  <text class="h" x="36" y="38">Scheduler / simulator (src/simulator.cpp)</text>
  <text class="s" x="36" y="58">waiting queue → admit (FCFS / shortest-prompt / priority) → running batch → one token per step</text>
  <text class="s" x="36" y="76">out of blocks → preempt a victim: recompute later, or swap to the CPU pool · priority may displace lower classes</text>
  <path class="ln" d="M450,92 L450,122"/>
  <text class="s" x="458" y="112">admit / append_token / fork / free</text>

  <!-- request block tables -->
  <rect class="box" x="20" y="124" width="300" height="252" rx="8"/>
  <text class="h" x="36" y="148">Block tables (per request)</text>
  <text class="s" x="36" y="166">logical block index → physical block id</text>

  <text class="t" x="36" y="194">Request A · 40 tokens</text>
  <rect class="blk" x="36" y="202" width="50" height="26"/><text class="t" x="52" y="220">7</text>
  <rect class="blk" x="90" y="202" width="50" height="26"/><text class="t" x="108" y="220">2</text>
  <rect class="part" x="144" y="202" width="50" height="26"/><text class="t" x="162" y="220">9</text>
  <text class="s" x="204" y="220">last block partial (8/16)</text>

  <text class="t" x="36" y="262">Request B · 60 tokens (shares A's prefix)</text>
  <rect class="blk" x="36" y="270" width="50" height="26"/><text class="t" x="52" y="288">7</text>
  <rect class="blk" x="90" y="270" width="50" height="26"/><text class="t" x="108" y="288">2</text>
  <rect class="blk" x="144" y="270" width="50" height="26"/><text class="t" x="162" y="288">4</text>
  <rect class="part" x="198" y="270" width="50" height="26"/><text class="t" x="216" y="288">5</text>

  <text class="t" x="36" y="330">Request C = fork(A)</text>
  <text class="s" x="36" y="346">shares ALL of A's blocks, incl. partial block 9;</text>
  <text class="s" x="36" y="360">its first append copies block 9 (copy-on-write)</text>

  <!-- physical pool -->
  <rect class="box" x="350" y="124" width="530" height="252" rx="8"/>
  <text class="h" x="366" y="148">Physical block pool (src/block_allocator.cpp)</text>
  <text class="s" x="366" y="166">fixed-size blocks · refcount per block · free list · lowest id allocated first</text>
  <g>
    <rect class="free" x="366" y="184" width="62" height="58"/><text class="t" x="390" y="206">0</text><text class="s" x="374" y="228">free</text>
    <rect class="free" x="432" y="184" width="62" height="58"/><text class="t" x="456" y="206">1</text><text class="s" x="440" y="228">free</text>
    <rect class="shared" x="498" y="184" width="62" height="58"/><text class="t" x="522" y="206">2</text><text class="s" x="506" y="228">ref 2+</text>
    <rect class="free" x="564" y="184" width="62" height="58"/><text class="t" x="588" y="206">3</text><text class="s" x="572" y="228">free</text>
    <rect class="blk" x="630" y="184" width="62" height="58"/><text class="t" x="654" y="206">4</text><text class="s" x="638" y="228">ref 1</text>
    <rect class="blk" x="696" y="184" width="62" height="58"/><text class="t" x="720" y="206">5</text><text class="s" x="704" y="228">ref 1</text>
    <rect class="free" x="762" y="184" width="62" height="58"/><text class="t" x="786" y="206">6</text><text class="s" x="770" y="228">free</text>
    <rect class="shared" x="366" y="250" width="62" height="58"/><text class="t" x="390" y="272">7</text><text class="s" x="374" y="294">ref 2+</text>
    <rect class="free" x="432" y="250" width="62" height="58"/><text class="t" x="456" y="272">8</text><text class="s" x="440" y="294">free</text>
    <rect class="shared" x="498" y="250" width="62" height="58"/><text class="t" x="522" y="272">9</text><text class="s" x="506" y="294">shared</text>
  </g>
  <text class="s" x="580" y="274">yellow: shared (refcount &gt; 1)</text>
  <text class="s" x="580" y="290">dashed: partially filled last block</text>
  <text class="s" x="580" y="306">copy-on-write: first append into a shared</text>
  <text class="s" x="580" y="322">partial block allocates a copy, drops 1 ref</text>
  <text class="s" x="366" y="340">validate(): free + referenced = total · refcount = table + cache refs · stats incremental = recomputed</text>


  <!-- prefix cache -->
  <rect class="box" x="20" y="396" width="410" height="150" rx="8"/>
  <text class="h" x="36" y="420">Persistent prefix cache (key = prefix group)</text>
  <rect class="cache" x="36" y="432" width="64" height="30"/><text class="t" x="56" y="452">7</text>
  <rect class="cache" x="104" y="432" width="64" height="30"/><text class="t" x="124" y="452">2</text>
  <text class="s" x="176" y="452">full blocks only, 1 ref each, outlive the request</text>
  <text class="s" x="36" y="482">admit_with_cached_prefix shares them (no recompute)</text>
  <text class="s" x="36" y="500">entries are evicted LRU-first whenever an allocation</text>
  <text class="s" x="36" y="518">would fail, so the cache never blocks admission</text>

  <!-- consumers -->
  <rect class="box" x="460" y="396" width="420" height="150" rx="8"/>
  <text class="h" x="476" y="420">Used by</text>
  <text class="s" x="476" y="444">tests/ · unit, randomized (3000 seeds), concurrency (TSan), fuzz/ (libFuzzer)</text>
  <text class="s" x="476" y="464">bench/ · multi-seed paged vs contiguous, policies, cache, priority, swap</text>
  <text class="s" x="476" y="484">python/ · pybind11 KVManager driving a real LLM's KV tensors (CPU)</text>
  <text class="s" x="476" y="504">cuda/ · decode attention kernel reading K/V through the block table</text>
  <text class="s" x="476" y="524">   (written and compile-checked; not yet run on a GPU)</text>
  <path class="ln" d="M430,471 C445,471 450,471 460,471"/>
</svg>
